name: Deploy HexColony to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment

      # Tell every open device straight away. The app watches this document, so a build
      # reaches phones the moment it lands instead of whenever they next poll. The web
      # API key is public by design and the rules only allow this one document to be
      # written, so no secret is needed here.
      - name: Publish the version for live clients
        run: |
          VERSION=$(grep -o "APP_VERSION = '[^']*'" public/version.js | grep -o "[0-9][0-9.]*")
          echo "publishing $VERSION"
          curl -sS -X PATCH             "https://firestore.googleapis.com/v1/projects/catanx-6644/databases/(default)/documents/meta/version?key=AIzaSyBTc0uLxBGerekxPHdFhDsyFeCmjXynhec"             -H "Content-Type: application/json"             -d "{\"fields\":{\"version\":{\"stringValue\":\"$VERSION\"},\"at\":{\"timestampValue\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}"             -o /dev/null -w "firestore: %{http_code}
"
