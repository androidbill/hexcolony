name: Deploy HexColony to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment

      # Tell every open device straight away. The app watches this one document, so a
      # build reaches phones the moment it lands instead of whenever they next poll.
      #
      # The web API key is public by design — it identifies the project, it does not
      # authorise anything — and the rules allow nothing to be written here but this
      # single document, so no repository secret is involved.
      #
      # The JSON goes through printf into a file rather than inline: quoting a JSON
      # body through YAML and then through the shell is how the first attempt at this
      # step broke, and it broke silently at parse time.
      - name: Publish the version for live clients
        run: |
          VERSION=$(grep -oE "APP_VERSION = '[^']+'" public/version.js | grep -oE "[0-9][0-9.]+")
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "publishing $VERSION at $NOW"
          printf '{"fields":{"version":{"stringValue":"%s"},"at":{"timestampValue":"%s"}}}' "$VERSION" "$NOW" > version.json
          curl -sS -X PATCH -H "Content-Type: application/json" --data @version.json -o response.json -w 'firestore: %{http_code}\n' "https://firestore.googleapis.com/v1/projects/catanx-6644/databases/(default)/documents/meta/version?key=AIzaSyBTc0uLxBGerekxPHdFhDsyFeCmjXynhec"
          cat response.json
